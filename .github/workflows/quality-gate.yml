name: quality-gate

on:
  pull_request:
    branches:
      - main

jobs:
  # Format, lint, and typecheck fail in seconds; this runs parallel to the
  # test job so a style nit never waits behind the slow lane.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']

      - name: Typecheck
        run: vp run typecheck

      - name: Check (format + lint)
        run: vp check

  # The expensive lane: the default suite includes docker-sandbox tests. Fallow
  # audit reuses that coverage run, so it shares the job instead of spinning the
  # suite up a second time.
  tests:
    runs-on: ubuntu-latest
    steps:
      # Full history: fallow audit diffs the changeset against the merge-base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']

      - name: Test
        run: vp test run --coverage

      # Quality gate that cannot be skipped client-side: the pre-commit hook
      # runs the same audit, but --no-verify bypasses it. Branch protection
      # should require this job.
      - name: Fallow audit
        run: vp exec fallow audit

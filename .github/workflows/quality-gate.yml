name: quality-gate

on:
  pull_request:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: voidzero-dev/setup-vp@6a033122543ee100d01838245fe74a26a038da6d # v1.21.2
        with:
          node-version-file: .node-version
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']

      - name: Typecheck
        run: vp run typecheck

      - name: Check (format + lint)
        run: vp check

      - name: Test
        run: vp test run
